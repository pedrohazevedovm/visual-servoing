[project]
name = "visual-servoing"
version = "0.1.0"
description = "visual servoing master project"
authors = [
    { name = "Pedro Mendonca", email = "phavm@cin.ufpe.br"}
]
readme = "README.md"
license = { file = "LICENSE"}
requires-python = ">=3.9"
urls = {Repository = "https://github.com/pedrohazevedovm/visual-servoing"}

dependencies = [
    "torch>=1.9.1",
    "torchvision>=0.3",
    "numpy",
    "opencv-python",
    "matplotlib",
    "kornia>=0.6.11",
]

[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
lightglue = {path = "./LightGlue", develop = true}