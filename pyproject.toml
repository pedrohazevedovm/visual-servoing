[project]
name = "visual-servoing"
version = "0.1.0"
description = "visual servoing master project"
authors = [
    { name = "Pedro Mendonca", email = "phavm@cin.ufpe.br"}
]
readme = "README.md"
license = { file = "LICENSE"}
requires-python = ">=3.11,<3.15"
urls = {Repository = "https://github.com/pedrohazevedovm/visual-servoing"}

[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<3.15"

# 1. Dependências comuns
numpy = "*"
opencv-python = "*"
matplotlib = "*"

# 2. Dependência Local (LightGlue)
lightglue = {path = "./LightGlue", develop = true}

# 3. Kornia
kornia = ">=0.6.11"

# 4. PyTorch e Torchvision (Direcionados para CPU)
torch = {version = ">=2.4.0", source = "pytorch_cpu"}
torchvision = {version = ">=0.19.0", source = "pytorch_cpu"}

# 5. Outras dependências
looseversion = "^1.3.0"
cython = "^3.2.4"
scikit-image = "^0.26.0"

# Fonte explícita para garantir o download apenas dos binários de CPU
[[tool.poetry.source]]
name = "pytorch_cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"