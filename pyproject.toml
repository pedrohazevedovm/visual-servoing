[project]
name = "visual-servoing"
version = "0.1.0"
description = "visual servoing master project"
authors = [
    { name = "Pedro Mendonca", email = "phavm@cin.ufpe.br"}
]
readme = "README.md"
license = { file = "LICENSE"}
# Expandido para 3.11 a 3.14 de forma a harmonizar com o submódulo "hed"
requires-python = ">=3.11,<3.15"
urls = {Repository = "https://github.com/pedrohazevedovm/visual-servoing"}

[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<3.15"

# 1. Dependências comuns (Fixadas em versões compatíveis com ambos)
numpy = ">=1.24.0,<2.0.0" # Satisfaz o scikit-image e evita quebrar o Borůvka / OpenCV
opencv-python = "*"
matplotlib = "*"

# 2. Dependência Local (LightGlue)
lightglue = {path = "./LightGlue", develop = true}

# 3. Kornia
kornia = ">=0.6.11"

# 4. PyTorch e Torchvision com suporte a CUDA (Estável e indexado)
torch = {version = ">=2.4.0,<2.6.0", source = "pytorch_cuda"}
torchvision = {version = ">=0.19.0,<0.21.0", source = "pytorch_cuda"}

# 5. Outras dependências requisitadas pelos dois pacotes
looseversion = "^1.3.0"
cython = "^3.2.4"
scikit-image = "^0.26.0"
tqdm = "^4.67.1"
pillow = "^10.0.0" # Versão estável que aceita NumPy < 2 e Python 3.11+
scipy = "^1.11.0"
pyaml = "^25.7.0"
ptflops = "^0.7.5"
imageio = "^2.37.2"
wandb = ">=0.24"

# Mudança de Fonte para CUDA 12.1 / 12.4 (Ampla distribuição de binários para Linux e Windows)
[[tool.poetry.source]]
name = "pytorch_cuda"
url = "https://download.pytorch.org/whl/cu121"
priority = "explicit"

