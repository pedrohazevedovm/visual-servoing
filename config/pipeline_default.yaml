pipeline:
  - type: "roi_crop"
    enabled: true
    params:
      pct_w: 0.8
      pct_h: 0.8

  - type: "histogram_matching"
    enabled: false
    params: {}

  - type: "bilateral_filter"
    enabled: true
    params:
      d: 9
      sigmaColor: 75.0
      sigmaSpace: 75.0

  - type: "edge_detection"
    enabled: true
    params:
      method: "none" # Options: 'canny', 'octhed', 'none'
      threshold1: 50.0
      threshold2: 150.0
      scale_factor: 0.5
      use_amp: false 
      lite_mode: false
      use_nms: true

  - type: "superpixel_reduction"
    enabled: true
    params:
      algorithm: "boruvka" # Options: 'boruvka', 'slic', 'meanshift', 'none'
      n_superpixels: 50
      compactness: 10.0

  - type: "feature_matching"
    enabled: true
    params:
      max_num_keypoints: 512
      filter_threshold: 0.1
      depth_confidence: 0.80
      width_confidence: 0.90
      n_layers: 6
      mp: false

wandb:
  enabled: true
  project: "visual-servoing"
  entity: "phavm-ufpe"

