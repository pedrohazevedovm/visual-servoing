pipeline:
  - type: "histogram_matching"
    enabled: false
    params: {}

  - type: "bilateral_filter"
    enabled: true
    params:
      d: 9
      sigmaColor: 75.0
      sigmaSpace: 75.0

  - type: "edge_detection"
    enabled: false
    params:
      method: "canny" # Options: 'canny', 'octhed', 'none'
      threshold1: 50.0
      threshold2: 150.0

  - type: "superpixel_reduction"
    enabled: false
    params:
      algorithm: "boruvka" # Options: 'boruvka', 'slic', 'meanshift', 'none'
      n_superpixels: 50
      compactness: 50.0

  - type: "roi_crop"
    enabled: false
    params:
      pct_w: 0.3
      pct_h: 0.5

  - type: "feature_matching"
    enabled: true
    params:
      max_num_keypoints: 512
      filter_threshold: 0.1
